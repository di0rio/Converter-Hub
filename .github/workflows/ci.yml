name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege. Pull requests from forks carry untrusted code, so the job
# token is read-only. Any future job that needs write access (release,
# publish, labelling) must live in a separate workflow that never checks out
# pull-request code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Both actions are pinned to a full commit SHA: a mutable tag would let a
      # compromise of the action run here with no diff in this repo. The
      # comment names the release the SHA belongs to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the token in .git/config for later steps to reach.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match "packageManager" in apps/web/package.json.
          bun-version: 1.4.0

      # --ignore-scripts stops dependency lifecycle scripts from executing in
      # CI, which is the main supply-chain path a pull request can reach.
      # --frozen-lockfile fails the build if a manifest and the lockfile
      # disagree, so dependency changes cannot slip in unlocked.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Build the core package before typechecking its consumers. The generated
      # packages/core/dist output is gitignored and absent on a fresh checkout.
      - name: Build core
        run: bun run --filter @sql-extractor/core build

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test